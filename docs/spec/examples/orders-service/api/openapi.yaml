openapi: 3.1.0
info:
  title: Orders API
  version: 2.3.0
  description: Create, read and cancel orders.
  contact: { name: team-orders, url: "https://chat.internal/channels/team-orders" }
servers:
  - url: https://orders.prod.internal
    description: Production
tags:
  - name: orders
    description: Order lifecycle.
security:
  - bearerAuth: []
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get an order
      description: Returns a single order by id.
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /orders/{orderId}/cancellation:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      description: Requests cancellation. Emits com.acme.orders.order.cancelled.v1 on success.
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [customer_request, payment_failed, out_of_stock] }
      responses:
        "202": { description: Cancellation accepted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Order identifier.
      schema: { type: string, pattern: "^ord_[a-zA-Z0-9]+$", maxLength: 64 }
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, description: Minor units. }
        currency: { type: string, pattern: "^[A-Z]{3}$", maxLength: 3 }
    Order:
      type: object
      required: [orderId, customerId, status, total]
      properties:
        orderId: { type: string, maxLength: 64 }
        customerId: { type: string, maxLength: 64 }
        status: { type: string, enum: [placed, paid, shipped, cancelled] }
        total: { $ref: "#/components/schemas/Money" }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 256 }
        status: { type: integer, format: int32 }
        detail: { type: string, maxLength: 2048 }
