{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
<title>{{if .Title}}{{.Title}} · {{end}}{{.Org}} API portal</title>
<link rel="icon" href="{{static "favicon.svg"}}" type="image/svg+xml">
<link rel="stylesheet" href="{{static "app.css"}}">
<script src="{{static "htmx.min.js"}}" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">{{.Org}} API portal</a>
  {{with .User}}
  <nav>
    <a href="/" {{if eq $.Nav "home"}}aria-current="page"{{end}}>Home</a>
    <a href="/apis" {{if eq $.Nav "apis"}}aria-current="page"{{end}}>APIs</a>
  </nav>
  <div class="user">
    <span>{{.DisplayName}}</span>
    {{if .Admin}}<span class="badge admin">admin</span>{{end}}
    <form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>
  </div>
  {{end}}
</header>
<main>
{{block "content" .}}{{end}}
</main>
</body>
</html>
{{end}}
