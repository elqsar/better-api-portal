version: '3'

silent: true

vars:
  DEV_DSN: postgres://portal:portal@localhost:55432/portal?sslmode=disable

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the portal binary into bin/
    sources:
      - '**/*.go'
      - docs/spec/schemas/*.json
      - go.mod
      - go.sum
    generates:
      - bin/portal
    cmds:
      - go build -o bin/portal ./cmd/portal

  test:
    desc: Run unit and golden-file tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:examples:
    desc: Run portal check over every example in docs/spec/examples
    deps: [build]
    cmds:
      - |
        for f in docs/spec/examples/*/portal.yaml; do
          echo "== $f"
          bin/portal check --config docs/spec/examples/portal.config.yaml --descriptor "$f" || exit 1
        done

  dev:db:
    desc: Start the development Postgres with podman-compose
    cmds:
      - podman-compose up -d --wait db

  dev:db:down:
    desc: Stop the development Postgres and delete its data
    cmds:
      - podman-compose down -v

  psql:
    desc: Open psql on the development database
    interactive: true
    cmds:
      - podman-compose exec db psql -U portal portal

  migrate:
    desc: Apply database migrations to the development database
    deps: [build]
    cmds:
      - bin/portal migrate --dsn '{{.DEV_DSN}}'

  run:
    desc: Run portal serve against the development database, on http://localhost:8080, with the stub sign-in
    deps: [build]
    cmds:
      - bin/portal serve --dsn '{{.DEV_DSN}}' --config docs/spec/examples/portal.config.yaml --dev-login

  test:integration:
    desc: Run the tests that need Postgres, including the end-to-end CLI tests (start it with task dev:db)
    env:
      PORTAL_TEST_DSN: '{{.DEV_DSN}}'
    cmds:
      - go test -tags integration -count=1 ./internal/store/... ./internal/httpapi/... ./internal/web/... ./cmd/portal/... {{.CLI_ARGS}}

  bench:search:
    desc: Benchmark search over 500 synthetic APIs, and log the query plan (start Postgres with task dev:db)
    env:
      PORTAL_TEST_DSN: '{{.DEV_DSN}}'
    cmds:
      - go test -tags integration -count=1 -run '^$' -bench Search -v ./internal/store/ {{.CLI_ARGS}}
