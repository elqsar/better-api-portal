version: '3'

silent: true

vars:
  DEV_DSN: postgres://portal:portal@localhost:55432/portal?sslmode=disable

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the portal binary into bin/
    sources:
      - '**/*.go'
      - docs/spec/schemas/*.json
      - go.mod
      - go.sum
    generates:
      - bin/portal
    cmds:
      - go build -o bin/portal ./cmd/portal

  release:
    desc: 'Build release archives for Linux and macOS (amd64, arm64) into dist/, with SHA256SUMS: task release -- v0.1.0 (default: git describe)'
    vars:
      VERSION:
        sh: echo "{{.CLI_ARGS}}" | grep . || git describe --tags --always --dirty
      PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
    cmds:
      - rm -rf dist && mkdir -p dist
      - for: { var: PLATFORMS }
        cmd: |
          os={{splitList "/" .ITEM | first}}; arch={{splitList "/" .ITEM | last}}
          name=portal_{{.VERSION}}_${os}_${arch}
          mkdir -p dist/$name
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o dist/$name/portal ./cmd/portal
          cp internal/web/static/LICENSES.txt dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          rm -r dist/$name
      - cd dist && shasum -a 256 *.tar.gz > SHA256SUMS
      - ls -lh dist

  image:
    desc: 'Build the container image better-api-portal:<version> with podman: task image -- v0.1.0 (default: git describe)'
    vars:
      VERSION:
        sh: echo "{{.CLI_ARGS}}" | grep . || git describe --tags --always --dirty
    cmds:
      # -p=2: the default podman machine (4 GB) runs out of memory otherwise.
      - podman build -f Containerfile --build-arg VERSION={{.VERSION}} --build-arg GOFLAGS=-p=2 -t better-api-portal:{{.VERSION}} .

  test:
    desc: Run unit and golden-file tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:examples:
    desc: Run portal check over every example in docs/spec/examples
    deps: [build]
    cmds:
      - |
        for f in docs/spec/examples/*/portal.yaml; do
          echo "== $f"
          bin/portal check --config docs/spec/examples/portal.config.yaml --descriptor "$f" || exit 1
        done

  dev:db:
    desc: Start the development Postgres with podman-compose
    cmds:
      - podman-compose up -d --wait db

  dev:db:down:
    desc: Stop the development Postgres and delete its data
    cmds:
      - podman-compose down -v

  psql:
    desc: Open psql on the development database
    interactive: true
    cmds:
      - podman-compose exec db psql -U portal portal

  migrate:
    desc: Apply database migrations to the development database
    deps: [build]
    cmds:
      - bin/portal migrate --dsn '{{.DEV_DSN}}'

  run:
    desc: Run portal serve against the development database, on http://localhost:8080, with the stub sign-in
    deps: [build]
    cmds:
      - bin/portal serve --dsn '{{.DEV_DSN}}' --config docs/spec/examples/portal.config.yaml --dev-login

  test:integration:
    desc: Run the tests that need Postgres, including the end-to-end CLI tests (start it with task dev:db)
    env:
      PORTAL_TEST_DSN: '{{.DEV_DSN}}'
    cmds:
      - go test -tags integration -count=1 ./internal/store/... ./internal/httpapi/... ./internal/web/... ./cmd/portal/... {{.CLI_ARGS}}

  test:journeys:
    desc: Run the J1 and J3–J5 acceptance tests; `task test:journeys -- -update` rewrites their golden HTML (start Postgres with task dev:db)
    env:
      PORTAL_TEST_DSN: '{{.DEV_DSN}}'
    cmds:
      - go test -tags integration -count=1 -run TestJourney ./internal/web/ {{.CLI_ARGS}}

  bench:search:
    desc: Benchmark search over 500 synthetic APIs, and log the query plan (start Postgres with task dev:db)
    env:
      PORTAL_TEST_DSN: '{{.DEV_DSN}}'
    cmds:
      - go test -tags integration -count=1 -run '^$' -bench Search -v ./internal/store/ {{.CLI_ARGS}}
